id = "C001"
title = "Queen Bee may not be placed on the first turn (tournament rule)"
game_type = "Base"
setup = []

[expect]
kind = "move_illegal"
move = "wQ"

[annotation]
rule = "Tournament opening rule"
source = "Tournament variant of the official rules (README source 4); Gen42 2010 rulesheet p. 3 alone would allow it"
justification = """The 2010 base rulesheet says the Queen 'can be placed at
any time from your first to your fourth turn' (p. 3), but the tournament
variant — adopted by UHP and both reference engines, and the convention this
study fixes — forbids placing the Queen Bee on either player's first turn.
White's first move 'wQ' must therefore be rejected."""
