id = "C005"
title = "Second player's first piece joins the first piece (may touch enemy)"
game_type = "Base"
setup = ["wS1"]

[expect]
kind = "moves_for_piece"
piece = "bG1"
moves = ["bG1 wS1-", "bG1 wS1/", "bG1 wS1\\", "bG1 -wS1", "bG1 /wS1", "bG1 \\wS1"]

[annotation]
rule = "Playing the Game / Placing"
source = "Gen42 Hive rulesheet pp. 2-3"
justification = """'Play begins with one player placing a piece from their
hand in the centre of the table and the next player joining one of their own
pieces to it edge to edge.' (p. 2) — the first-piece exception to the
own-colour placing rule. Black's first piece must join wS1 edge to edge, so
bG1 may be placed on any of the six cells adjacent to wS1, and nowhere
else."""
