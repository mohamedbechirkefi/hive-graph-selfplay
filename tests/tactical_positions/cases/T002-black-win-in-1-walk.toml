id = "T002"
title = "Black mates in 1: occupy the white queen's last liberty (SE of wQ)"
game_type = "Base"
# Colour-mirrored T001: white has surrounded its own queen wQ(1,0) on five
# sides (wS1 W, wG1 E, wG2 NE, wB1 NW, wA1 SW); only SE of wQ is empty.
# Black to move; black's tail runs west.
setup = [
  "wS1", "bS1 -wS1", "wQ wS1-", "bQ -bS1", "wG1 wQ-", "bG1 -bQ",
  "wG2 wQ/", "bG2 -bG1", "wB1 \\wQ", "bA1 -bG2", "wA1 wS1\\", "bA2 -bA1",
  "wA2 wG1-",
]

[expect]
kind = "bestmove_to_cell"
target = "wQ\\"

[annotation]
rule = "The End of the Game"
source = "Gen42 Hive rulesheet pp. 1, 11"
justification = """Mirror of T001 with the colours exchanged and black to
move — this pair is the player-alternation check at the move level: the
winning pattern must be found from both sides. The white queen's only
empty neighbour is the cell SE of wQ; a black ant reaches it along the
south perimeter (route via SE of bS1's column: the step into the cell is
flanked by the occupied wA1 cell, so contact holds and no gate blocks).
Landing there completes the surround: Black wins (p. 11)."""
